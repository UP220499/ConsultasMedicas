<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Consulta Médica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body.auth-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.97);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(76, 110, 245, 0.15);
            overflow: hidden;
        }

        .auth-card .card-header {
            border-radius: 18px 18px 0 0;
            background: linear-gradient(90deg, #1976d2 0%, #00bcd4 100%);
            color: #fff;
        }

        .input-group-text {
            background: #f4f7fa;
            border: none;
        }

        .form-control:focus {
            box-shadow: 0 0 0 2px #00bcd4;
        }

        .btn-lg {
            font-size: 1.1rem;
            padding: 0.75em 1.5em;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 0.95em;
            margin-bottom: 0.5em;
            display: none;
        }

        .auth-tabs .nav-link {
            font-weight: 500;
            font-size: 1.1em;
            color: #1976d2;
        }

        .auth-tabs .nav-link.active {
            background: linear-gradient(90deg, #1a237e 0%, #00bcd4 100%);
            color: #fff !important;
        }

        .btn-primary,
        .btn-success {
            background: linear-gradient(90deg, #1976d2 0%, #00bcd4 100%);
            border: none;
        }

        .btn-primary:hover,
        .btn-success:hover {
            background: #1a237e;
            color: #fff;
        }

        .btn-outline-primary {
            border-color: #00bcd4;
            color: #00bcd4;
        }

        .btn-outline-primary:hover {
            background: #00bcd4;
            color: #fff;
        }

        .btn-outline-secondary {
            border-color: #1976d2;
            color: #1976d2;
        }

        .btn-outline-secondary:hover {
            background: #1976d2;
            color: #fff;
        }
    </style>
</head>

<body class="auth-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card auth-card">
                    <div class="card-header text-center">
                        <h3><i class="bi bi-heart-pulse-fill me-2"></i>Sistema de Consulta Médica</h3>
                        <p class="mb-0">Gestión integral de citas médicas</p>
                    </div>
                    <div class="card-body p-4">
                        <!-- TABS DE NAVEGACIÓN -->
                        <ul class="nav nav-pills nav-justified mb-4 auth-tabs" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="login-tab" data-bs-toggle="pill"
                                    data-bs-target="#login-panel" type="button" role="tab">
                                    <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="register-tab" data-bs-toggle="pill"
                                    data-bs-target="#register-panel" type="button" role="tab">
                                    <i class="bi bi-person-plus me-1"></i>Registrarse
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabsContent">
                            <!-- PANEL DE LOGIN -->
                            <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                                <form id="login-form" autocomplete="on">
                                    <div id="login-error" class="error-msg"></div>
                                    <div class="mb-3">
                                        <label class="form-label">Email *</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                            <input type="email" class="form-control" id="login-email"
                                                placeholder="usuario@example.com" required autocomplete="username">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Contraseña *</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                            <input type="password" class="form-control" id="login-password"
                                                placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                                        </div>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary btn-lg" id="login-btn">
                                            <span id="login-spinner" class="spinner-border spinner-border-sm me-2"
                                                style="display: none;"></span>
                                            Iniciar Sesión
                                        </button>
                                    </div>
                                </form>
                                <!-- USUARIOS DE PRUEBA -->
                                <div class="mt-4">
                                    <small class="text-muted">Usuarios de prueba:</small>
                                    <div class="row mt-2">
                                        <div class="col-6">
                                            <div class="card bg-light">
                                                <div class="card-body p-2 text-center">
                                                    <small><strong>Admin</strong><br>
                                                    admin@mediconsultas.com<br>
                                                    admin123</small>
                                                    <button class="btn btn-outline-warning btn-sm mt-1 w-100"
                                                        onclick="fillAdminCredentials()">Usar</button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="card bg-light">
                                                <div class="card-body p-2 text-center">
                                                    <small><strong>Paciente</strong><br>
                                                    maria@example.com<br>
                                                    123456</small>
                                                    <button class="btn btn-outline-success btn-sm mt-1 w-100"
                                                        onclick="fillPatientCredentials()">Usar</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- PANEL DE REGISTRO -->
                            <div class="tab-pane fade" id="register-panel" role="tabpanel">
                                <form id="register-form" autocomplete="on">
                                    <div id="register-error" class="error-msg"></div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Nombre Completo *</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                                <input type="text" class="form-control" id="register-nombre"
                                                    placeholder="Juan Pérez" required autocomplete="name">
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Email *</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                                <input type="email" class="form-control" id="register-email"
                                                    placeholder="usuario@example.com" required autocomplete="email">
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Contraseña *</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                                <input type="password" class="form-control" id="register-password"
                                                    placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Teléfono</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                                <input type="tel" class="form-control" id="register-telefono"
                                                    placeholder="+52 55 1234 5678" autocomplete="tel">
                                            </div>
                                        </div>
                                        <div class="col-12 mb-3">
                                            <label class="form-label">Tipo de Usuario *</label>
                                            <select class="form-select" id="register-tipo" required>
                                                <option value="PACIENTE">Paciente - Solicitar citas médicas</option>
                                                <option value="ADMIN">Administrador - Gestionar sistema (requiere autorización)
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-success btn-lg" id="register-btn">
                                            <span id="register-spinner" class="spinner-border spinner-border-sm me-2"
                                                style="display: none;"></span>
                                            Registrarse
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- ACCESO RÁPIDO -->
                        <div class="text-center mt-4">
                            <hr>
                            <p class="text-muted">¿Solo quieres consultar información?</p>
                            <div class="btn-group" role="group">
                                <a href="medicos.html" class="btn btn-outline-primary btn-sm">Ver Médicos</a>
                                <a href="index.html" class="btn btn-outline-secondary btn-sm">Página Principal</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:8080/api';

        function showError(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = msg ? 'block' : 'none';
        }

        // Llenar credenciales de admin
        function fillAdminCredentials() {
            document.getElementById('login-email').value = 'admin@mediconsultas.com';
            document.getElementById('login-password').value = 'admin123';
        }

        // Llenar credenciales de paciente
        function fillPatientCredentials() {
            document.getElementById('login-email').value = 'maria@example.com';
            document.getElementById('login-password').value = '123456';
        }

        // Manejar login
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            showError('login-error', '');
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const loginBtn = document.getElementById('login-btn');
            const spinner = document.getElementById('login-spinner');
            if (!email || !password) {
                showError('login-error', 'Por favor completa todos los campos');
                return;
            }
            loginBtn.disabled = true;
            spinner.style.display = 'inline-block';
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (data.success) {
                    const userSession = {
                        tipo: data.usuario.tipo.toLowerCase(),
                        email: data.usuario.email,
                        nombre: data.usuario.nombre,
                        telefono: data.usuario.telefono,
                        id: data.usuario.id,
                        loginTime: new Date().toISOString()
                    };
                    localStorage.setItem('userSession', JSON.stringify(userSession));
                    alert(`¡Bienvenido ${data.usuario.nombre}!`);
                    if (data.usuario.tipo === 'ADMIN') {
                        window.location.href = 'dashboard-admin.html';
                    } else {
                        window.location.href = 'dashboard-paciente.html';
                    }
                } else {
                    showError('login-error', data.message || 'Error al iniciar sesión');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('login-error', 'Error de conexión. Verifica que el backend esté funcionando.');
            } finally {
                loginBtn.disabled = false;
                spinner.style.display = 'none';
            }
        });

        // Manejar registro
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            showError('register-error', '');
            const nombre = document.getElementById('register-nombre').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const telefono = document.getElementById('register-telefono').value;
            const tipo = document.getElementById('register-tipo').value;
            const registerBtn = document.getElementById('register-btn');
            const spinner = document.getElementById('register-spinner');
            if (!nombre || !email || !password) {
                showError('register-error', 'Por favor completa todos los campos obligatorios');
                return;
            }
            if (password.length < 6) {
                showError('register-error', 'La contraseña debe tener al menos 6 caracteres');
                return;
            }
            registerBtn.disabled = true;
            spinner.style.display = 'inline-block';
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password, telefono, tipo })
                });
                const data = await response.json();
                if (data.success) {
                    alert('¡Registro exitoso! Ya puedes iniciar sesión.');
                    document.getElementById('login-tab').click();
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-password').value = password;
                } else {
                    showError('register-error', data.message || 'Error al registrarse');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('register-error', 'Error de conexión. Verifica que el backend esté funcionando.');
            } finally {
                registerBtn.disabled = false;
                spinner.style.display = 'none';
            }
        });

        // Verificar si ya hay una sesión activa y manejar hash de URL
        window.onload = function() {
            if (window.location.hash === '#register') {
                document.getElementById('register-tab').click();
            }
            const session = localStorage.getItem('userSession');
            if (session) {
                const userData = JSON.parse(session);
                if (confirm(`Ya tienes una sesión activa como ${userData.nombre}. ¿Continuar?`)) {
                    if (userData.tipo === 'admin') {
                        window.location.href = 'dashboard-admin.html';
                    } else {
                        window.location.href = 'dashboard-paciente.html';
                    }
                } else {
                    localStorage.removeItem('userSession');
                }
            }
        };

        // Manejar cambios de hash para navegación
        window.addEventListener('hashchange', function() {
            if (window.location.hash === '#register') {
                document.getElementById('register-tab').click();
            } else {
                document.getElementById('login-tab').click();
            }
        });
    </script>
</body>

</html>
